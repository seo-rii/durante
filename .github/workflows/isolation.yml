name: isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durante-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake patch python3 meson ninja-build pkg-config libcap-dev
      - name: Build the CLI and pinned runtimes
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --release --locked
          python3 toolkit/fetch_sdk.py
          python3 toolkit/build_isolation.py --output "$RUNNER_TEMP/isolation-tool/bwrap" --work-dir "$RUNNER_TEMP/isolation-build"
          cmake -S client -B build -DCMAKE_BUILD_TYPE=Release -DDynamoRIO_DIR="$PWD/toolkit/sdk/DynamoRIO-Linux-11.3.0-1/cmake"
          cmake --build build -j2
          mkdir -p "$RUNNER_TEMP/isolation-bin" .results
          cp target/release/durante "$RUNNER_TEMP/isolation-bin/durante"
          cc -O2 -Wall -Wextra -Werror tests/isolation_probe.c -o "$RUNNER_TEMP/isolation-bin/probe"
      - name: Build a disposable Python runtime image
        run: docker build -f docker/isolation-test.Dockerfile -t durante-isolation-test .
      - name: Exercise the boundary in a finite private cgroup
        shell: bash
        run: |
          set -euo pipefail
          sdk="$PWD/toolkit/sdk/DynamoRIO-Linux-11.3.0-1"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --memory=1g --pids-limit=64 --cpus=1 --cgroupns=private \
            --security-opt systempaths=unconfined \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,exec,mode=1777,size=268435456 -e TMPDIR=/tmp \
            --mount "type=bind,src=$RUNNER_TEMP/isolation-bin,dst=/validation,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/isolation-tool,dst=/isolation-tool,readonly" \
            --mount "type=bind,src=$sdk,dst=$sdk,readonly" \
            --mount "type=bind,src=$PWD/build,dst=$PWD/build,readonly" \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/.results,dst=/results" \
            --entrypoint /usr/bin/python3 durante-isolation-test \
            /source/tests/isolation_smoke.py --runner-bin /validation/durante \
            --launcher /isolation-tool/bwrap --sdk "$sdk" \
            --client "$PWD/build/libdurante.so" --probe-binary /validation/probe \
            --output-dir /results/isolation
      - name: Preserve boundary results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolation-regressions
          path: .results/
          include-hidden-files: true
          if-no-files-found: warn
