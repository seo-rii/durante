name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durante-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Isolate fuzz build outputs
        run: printf 'CARGO_TARGET_DIR=%s/durante-fuzz-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned sanitizer toolchain and fuzz runner
        run: |
          rustup toolchain install nightly-2026-04-22 --profile minimal
          cargo +nightly-2026-04-22 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz production stream decoder with AddressSanitizer
        run: cargo +nightly-2026-04-22 fuzz run raw_stream -- -max_total_time=45 -max_len=65536 -timeout=3 -rss_limit_mb=1024
      - name: Fuzz lifecycle graphs and aggregation invariants
        run: cargo +nightly-2026-04-22 fuzz run lifecycle_tree -- -max_total_time=45 -max_len=65536 -timeout=3 -rss_limit_mb=1024
      - name: Preserve reproducer inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collector-fuzz-reproducers
          path: fuzz/artifacts/
          if-no-files-found: ignore
