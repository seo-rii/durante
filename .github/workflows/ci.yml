name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workmeter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install build dependencies and interpreter smoke targets
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake python3 pypy3
      - name: Verify and extract the pinned DynamoRIO SDK
        run: python3 toolkit/fetch_sdk.py
      - name: Build the counter
        run: |
          cmake -S client -B build -DCMAKE_BUILD_TYPE=Release -DDynamoRIO_DIR="$PWD/toolkit/sdk/DynamoRIO-Linux-11.3.0-1/cmake"
          cmake --build build -j2
      - name: Validate lifecycle records and aggregation
        run: python3 -m unittest discover -s tests -v
      - name: Validate real native and interpreter process trees
        run: python3 tests/smoke.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libworkmeter.so --output-dir .results/smoke
      - name: Validate bounded address-space reservations
        run: python3 tests/smoke.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libworkmeter.so --compact-vm --output-dir .results/smoke-compact
      - name: Preserve diagnostic test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-tree-smoke
          path: .results/
          if-no-files-found: ignore
