name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durante-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          mkdir "$RUNNER_TEMP/empty-ignore"
          env -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all --full-history' --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty-ignore" --ignore-gitleaks-allow \
            --redact=100 --no-banner --no-color --report-format=json \
            --report-path "$RUNNER_TEMP/gitleaks.json"
  process-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Select cached PyPy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        timeout-minutes: 5
        with:
          python-version: 'pypy3.10-v7.3.19'
      - name: Select CPython for the harness and reference collector
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Verify runner build tools and required runtimes
        shell: bash
        run: |
          set -euo pipefail
          for tool in gcc g++ cmake patch python3 pypy3 node; do command -v "$tool"; done
          test -x "$JAVA_HOME_17_X64/bin/java"
          test -x "$JAVA_HOME_17_X64/bin/javac"
          gcc --version
          cmake --version
          python3 --version
          pypy3 --version
          node --version
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Validate the Rust collector and supervisor
        run: |
          cargo +1.94.0 fmt --all -- --check
          cargo +1.94.0 clippy --locked --all-targets -- -D warnings
          cargo +1.94.0 test --locked --all-targets
          cargo +1.94.0 build --locked --release
      - name: Differential-fuzz hostile records against both collectors
        id: differential
        run: python3 tests/differential_collect.py --collector-bin target/release/durante --cases 512 --seed 20261111 --failure-dir .results/differential-failure
      - name: Preserve a differential failure for exact replay
        if: failure() && steps.differential.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: differential-failure
          path: .results/differential-failure/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build the pinned DynamoRIO runtime with concurrency fixes
        run: python3 toolkit/fetch_sdk.py
      - name: Build the counter
        run: |
          cmake -S client -B build -DCMAKE_BUILD_TYPE=Release -DDynamoRIO_DIR="$PWD/toolkit/sdk/DynamoRIO-Linux-11.3.0-1/cmake"
          cmake --build build -j2
      - name: Validate lifecycle records and aggregation
        run: python3 -m unittest discover -s tests -v
      - name: Qualify exact SIMD counts and preserved arithmetic results
        run: python3 tests/simd.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/simd --require-isa sse2 --repeats 2
      - name: Qualify interpreter and JIT fixtures against native and engine controls
        run: python3 tests/runtime_compat.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/runtime-compat --require-runtime cpython --require-runtime pypy --require-runtime node --require-qualified-runtime java --java "$JAVA_HOME_17_X64/bin/java" --javac "$JAVA_HOME_17_X64/bin/javac" --timeout-ms 40000
      - name: Validate clone3 cleared handlers and rejected fork-style accounting
        run: python3 tests/clone_clear_sighand.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/clone-clear --repeats 3 --require-clone3
      - name: Validate cleared handlers with debug runtime assertions
        run: python3 tests/clone_clear_sighand.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/clone-clear-debug --engine-debug --modes normal failed-exec --repeats 3 --require-clone3
      - name: Validate real native and interpreter process trees
        run: python3 tests/smoke.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --output-dir .results/smoke --collector-bin target/release/durante
      - name: Validate bounded address-space reservations
        run: python3 tests/smoke.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --compact-vm --output-dir .results/smoke-compact --collector-bin target/release/durante --runner-bin target/release/durante
      - name: Validate descriptor cleanup and default Python subprocesses
        run: python3 tests/close_range.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/close-range --repeats 2
      - name: Check hostile filesystem entries and unqualified exec paths
        run: python3 tests/adversarial_native.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/adversarial-native --demonstrate-report-forgery
      - name: Reject compatibility-ABI accounting omissions
        run: python3 tests/compat_syscalls.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/compat-syscalls
      - name: Validate descriptor cleanup with debug runtime assertions
        run: python3 tests/close_range.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/close-range-debug --repeats 1 --engine-debug
      - name: Stress concurrent process creation and exact child work
        run: python3 tests/concurrent_spawn.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/concurrent-spawn --repeats 20 --timeout-ms 20000
      - name: Check debug runtime assertions during concurrent process creation
        run: python3 tests/concurrent_spawn.py --sdk toolkit/sdk/DynamoRIO-Linux-11.3.0-1 --client build/libdurante.so --runner-bin target/release/durante --output-dir .results/concurrent-spawn-debug --repeats 3 --engine-debug --timeout-ms 20000
      - name: Preserve diagnostic test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-tree-smoke
          path: .results/
          include-hidden-files: true
          if-no-files-found: error
