[package]
name = "durante-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
durante = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "raw_stream"
path = "fuzz_targets/raw_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lifecycle_tree"
path = "fuzz_targets/lifecycle_tree.rs"
test = false
doc = false
bench = false
