[package]
name = "durante"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "BSD-3-Clause"
description = "Diagnostic software-work measurement for Linux process trees"
repository = "https://github.com/seo-rii/durante"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
